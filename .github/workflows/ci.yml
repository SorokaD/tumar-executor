# CI: тесты, линтеры и проверка Docker-образа.
# Запускается на PR и push в develop; для main вызывается из deploy-vps.yml перед деплоем.

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OKX_HFT_RUNTIME_MODE: replay
      OKX_HFT_SAFE_MODE: "true"
      OKX_HFT_POSTGRES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,control]"

      - name: Pytest
        run: python -m pytest tests/ -q

      # Пока код не вычищен под ruff и mypy --strict, их ошибки не блокируют деплой.
      - name: Ruff
        continue-on-error: true
        run: python -m ruff check .

      - name: Mypy
        continue-on-error: true
        run: python -m mypy

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t okx-hft-executor:ci .

      - name: Smoke test (--dry-run, stub exchange, no Postgres)
        run: |
          docker run --rm \
            -e OKX_HFT_RUNTIME_MODE=replay \
            -e OKX_HFT_SAFE_MODE=true \
            -e OKX_HFT_POSTGRES_ENABLED=false \
            okx-hft-executor:ci --dry-run
