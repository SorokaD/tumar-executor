# Конфигурация стратегий (не .env). Путь: OKX_HFT_STRATEGIES_CONFIG или config/strategies.yaml
default: random_baseline_v1

strategies:
  random_baseline_v1:
    enabled: true
    inst_id: BTC-USDT-SWAP
    execution:
      td_mode: isolated
      ord_type: post_only
      order_size: "0.01"
      maker_reprice_sec: 3
      maker_max_wait_sec: 20
      fee_rate_maker: "0.0002"
      fee_rate_taker: "0.0005"
    decision_step_sec: 30
    cooldown_sec: 20
    take_profit_ticks: 700
    stop_loss_ticks: 350
    timeout_sec: 300
    exit_market_fallback_enabled: true
    exit_maker_max_attempts: 5
    exit_market_grace_sec: 30
    exit_maker_reprice_sec: 1
    exit_maker_max_wait_sec: 8
    exit_stale_reprice_ticks: 3
    entry_stale_reprice_ticks: 3
    shutdown_drain_sec: 25.0
    # Benchmark: запускается на отдельном субсчёте (OKX_ACCOUNT_LABEL), exit-параметры
    # (TP/SL/timeout/fallback) держать такими же, как у сравниваемой рабочей стратегии.
    # random_seed не задан — seed генерируется на старте и пишется в executor_runs.extra_json.
    # random_seed: 42

  mean_reversion_v1:
    enabled: false
    inst_id: ETH-USDT-SWAP
    execution:
      td_mode: isolated
      ord_type: post_only
      order_size: "0.01"
      maker_reprice_sec: 3
      maker_max_wait_sec: 20
